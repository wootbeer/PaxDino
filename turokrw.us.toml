# N64Recomp config for Turok: Rage Wars (USA, NRWE, z64 SHA-1
# 9f8cb190831945f6f707aa8c2b20e04fa4276795).
#
# The game runs its code through the TLB (docs/ROM_LAYOUT.md): the first MB
# of ROM is code at 0x00200400 (TLB entry 31 maps 0x00200000 onto physical
# 0), and a second block at ROM 0x164000 is code at 0x00400000 (TLB entry 0).
# Data is reached through kseg0 (0x80xxxxxx) as usual. The symbol file's
# sections follow the addresses the code itself uses.

[input]
# trw_entrypoint: sets the stack, sets TLB entry 31, then `jalr`s to
# trw_boot_main (0x002A70F0). The TLB writes are patched out below; the
# runtime sets up those views itself (src/game/tlb_views.cpp).
entrypoint = 0x00200400
output_func_path = "RecompiledFuncs"
rom_file_path = "turokrw.us.z64"
symbols_file_path = "TurokRWSyms/turokrw.us.syms.toml"

[patches]
# Never run under the recompiler: they install or are the game's own
# exception handler (TLB misses), or set up the TLB, which src/game/tlb_views.cpp
# replaces. Stubbed (empty bodies) where something still calls them.
stubs = [
    "trw_InstallExceptionVectors",
    "trw_CacheFlush0",
    "trw_CacheFlush1",
    "trw_GetSR",
    "trw_SetSR",
    "trw_ReadTLBEntry",
    "trw_MapTLB",
    # libultra ROM-handle init with no callers; it uses osPiRawReadIo,
    # which the runtime doesn't provide
    "trw_PiRomHandleInit",
]
ignored = [
    # osPiRawStartDma, implemented natively in src/game/pi_dma.cpp
    "trw_osPiRawStartDma",
    # osAiGetStatus, native in src/main/main.cpp (audio FIFO model)
    "trw_osAiGetStatus",
    # osMotorInit, native in src/game/controller_pak_hle.cpp (per-port pak)
    "trw_osMotorInit",
    # maps ROM data into TLB space; native in src/game/tlb_views.cpp
    "trw_VmMapRomRegion",
    "trw_SetTLBEntry",
    "trw_ExceptionVectors",
    "trw_Exception",
    "trw_ExceptionTail0",
    "trw_ExceptionTail1",
]

# The game's DMA thread waits for the PI interrupt it registers here
# (osSetEventMesg(OS_EVENT_PI, dma + 0xA48, 0x7D1)). The runtime doesn't
# track OS_EVENT_PI, so src/game/pi_dma.cpp records it to post completions.
[[patches.hook]]
func = "func_00256220"
before_vram = 0x0025626C
text = "    trw_set_pi_event(rdram, ctx->r5, 0x7D1);"

# libultra's osCreateViManager sets a default VI mode (__osViInit, NTSC
# LPN1), and the game relies on it: it waits for retraces before it ever
# calls osViSetMode. The runtime's osCreateViManager sets none, and its VI
# thread sends no retrace messages until a mode is set, so set the same
# default (the game's own osViModeNtscLpn1, 0x800D31E0) right after the call.
[[patches.hook]]
func = "func_00291334"
before_vram = 0x00291358
text = "    osViSetMode(rdram, (int32_t)0x800D31E0);"

# trw_boot_main reloads the first MB straight from the cartridge bus (lw from
# 0xB0001000) unless it detects a soft reset. The runtime has already loaded
# that MB, so always take the soft-reset branch: bnez $v0 -> b.
[[patches.instruction]]
func = "trw_boot_main"
vram = 0x002A71C4
value = 0x10000054

# osClockRate (u64 at 0x80147B00): libultra's osInitialize sets it (62.5 MHz,
# then x 3/4: 46.875 MHz, the CPU counter's rate), but N64Recomp skips the
# game's osInitialize and the runtime's doesn't set it, so it stayed 0. The
# game reads it in one place, func_00414430 (osGetTime in seconds), for the
# menu system's millisecond clock: divided by 0, every timestamp was the same
# and every step 0. Set right after the game's call.
[[patches.hook]]
func = "trw_boot_main"
before_vram = 0x002A7444
text = "    trw_set_clock_rate(rdram);"

# func_002372B4 draws a thin black border (fill rectangles, 2-3 pixels) around
# each player's view, hiding the screen edges on a TV. With the picture
# expanded to widescreen its sides land at the old 4:3 edges as two vertical
# lines, so those are dropped then (src/game/widescreen.cpp). The top and
# bottom stay: they cover a row the view doesn't draw.
[[patches.hook]]
func = "func_002372B4"
before_vram = 0x002372B4
text = "    trw_border_begin(rdram);"

[[patches.hook]]
func = "func_002372B4"
before_vram = 0x00237E58
text = "    trw_border_end(rdram);"

# HUD anchoring in widescreen: func_0022A36C goes through the players and
# draws each one's HUD with func_0021EED8 (2D sprites through func_002AAB58).
# src/game/widescreen.cpp writes RT64 commands around that call that anchor
# the HUD's pieces to the screen edges.
[[patches.hook]]
func = "func_0022A36C"
before_vram = 0x0022A3A4
text = "    trw_hud_begin(rdram, ctx->r16);"

[[patches.hook]]
func = "func_0022A36C"
before_vram = 0x0022A3AC
text = "    trw_hud_end(rdram);"

# The weapon wheel (func_002183E8, from the HUD routine) and the team select
# drawn after it (func_00218F08, given the player + 0xCCC) stay centred: the
