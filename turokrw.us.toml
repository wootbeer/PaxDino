# The co-op Frag Tag trials could never be won (the bug 1.1 fixed). Trials run
# Frag Tag with a frag limit of 0 (it ends on the tag limit, func_002281CC,
# which records the win). The frag-limit check (func_0022804C), run again at
# the end (func_0042D240), then took every player as having reached a limit
# of 0, and when the first in the list was a bot it overwrote the result with
# a failure. 1.1 returns "not reached" when the limit (0x801407E0 + 0x18) is
# 0; the same here.
[[patches.hook]]
func = "func_0022804C"
before_vram = 0x0022804C
text = "    if (MEM_W(0, (gpr)(int32_t)0x801407F8) == 0) { ctx->r2 = 0; return; }"

