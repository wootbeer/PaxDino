# song", whose load fails and is retried, so it never gets here. The file
# playing instead follows the volumes the game sets on that player, which is
# given 0, and stops with it.
[[patches.hook]]
func = "func_0025D3F0"
before_vram = 0x0025D588
text = "    trw_music_song(rdram, (uint32_t)MEM_W(0x28, ctx->r17), (uint32_t)MEM_W(0x14, ctx->r17));"

[[patches.hook]]
func = "n_alSeqpSetVol"
before_vram = 0x002AFE90
text = "    ctx->r5 = (gpr)(int64_t)(int16_t)trw_music_seqp_vol(rdram, (uint32_t)ctx->r4, (int32_t)(int16_t)ctx->r5);"

[[patches.hook]]
func = "n_alSeqpStop"
before_vram = 0x002AFEC0
