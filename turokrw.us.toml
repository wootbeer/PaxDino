# Two menu functions walk a jump table with a moving pointer (`lw $v0, 0($sN)`
# / `jr $v0`, then `addiu $sN, $sN, 4` each loop) instead of indexing it, so
# N64Recomp sees an indirect tail call and the generated code calls a case
# label as a function. Each table only maps the loop counter to a text ID, so
# the jump is replaced with that arithmetic.
# func_004288E0 (table 0x800DC6A0): counter $s1 -> $s0 = 0x149, then 0x14B + n.
[[patches.instruction]]
func = "func_004288E0"
vram = 0x00428910
value = 0x2630014B  # addiu $s0, $s1, 0x14B
[[patches.instruction]]
func = "func_004288E0"
vram = 0x00428914
value = 0x1620000A  # bnez $s1, 0x00428940 (else fall into the 0x149 case)
[[patches.instruction]]
func = "func_004288E0"
vram = 0x00428918
value = 0x00000000  # nop
# func_0042144C (table 0x800DC240): counter $s0 -> $a1 = 0x3B8 + n; every
# case loads the same $a0, so all go through the first case's code.
[[patches.instruction]]
func = "func_0042144C"
vram = 0x004214C8
value = 0x08108562  # j 0x00421588
[[patches.instruction]]
func = "func_0042144C"
vram = 0x004214CC
value = 0x00000000  # nop
[[patches.instruction]]
func = "func_0042144C"
vram = 0x00421594
value = 0x260503B8  # addiu $a1, $s0, 0x3B8

# trw_entrypoint's cop0/TLB instructions and its call to trw_SetTLBEntry,
# and the `break` after its jalr to trw_boot_main: on hardware that call never
# returns (the first osStartThread switches away for good), but the runtime's
# osStartThread returns to the entry thread, which then just ends.
[[patches.instruction]]
func = "recomp_entrypoint"
vram = 0x0020040C
value = 0x00000000
[[patches.instruction]]
func = "recomp_entrypoint"
vram = 0x00200410
value = 0x00000000
[[patches.instruction]]
func = "recomp_entrypoint"
vram = 0x00200418
value = 0x00000000
[[patches.instruction]]
func = "recomp_entrypoint"
vram = 0x0020041C
value = 0x00000000
[[patches.instruction]]
func = "recomp_entrypoint"
vram = 0x00200420
value = 0x00000000
[[patches.instruction]]
func = "recomp_entrypoint"
vram = 0x00200428
value = 0x00000000
[[patches.instruction]]
func = "recomp_entrypoint"
vram = 0x0020043C
value = 0x00000000
[[patches.instruction]]
func = "recomp_entrypoint"
vram = 0x0020046C
value = 0x00000000
[[patches.instruction]]
func = "recomp_entrypoint"
vram = 0x00200484
value = 0x00000000

# The rare hang loading a level. The controller reads run from the scheduler
# (func_00263A94): each retrace it collects the last read (func_002636E0,
# waiting for its SI message when the state at 0x80109BB8 is 0 or 1) and
# starts the next. Every 60 frames the main thread sets the state to 1 (query
# the controllers) without the lock, which is only right while a read is in
# flight. The pak and rumble setup when a level loads leaves the state at 2
# (nothing in flight); set to 1 then, the scheduler waited for a message that
# never came, and the frame never finished. The write only goes through over
# state 0 now (it comes back 60 frames later).
[[patches.hook]]
func = "func_002A1FD0"
before_vram = 0x002A2108
text = "    if (MEM_BU(0, (gpr)(int32_t)0x80109BB8) != 0) ctx->r3 = MEM_BU(0, (gpr)(int32_t)0x80109BB8);"

# The game's Cheats menu (Z on the main menu, state 0x1C) is left out: its
# settings (All Characters, All Weapons, Unlimited Ammo, Extra Modes) are on
# the menu's Cheats tab instead (F2; src/main/extras_config.cpp). The main
# menu's handler for event 0xA (func_004244B4) opened it on Z (0xA); the
# value compared with becomes -1, which no press is.
[[patches.instruction]]
func = "func_004244B4"
vram = 0x004244C8
value = 0x2402FFFF  # addiu $v0, $zero, -1 (was 0xA)

# Enhancements tab: Medals in Bot Matches. Medals are awarded at the end of a
# match (func_004245C0) only if func_00426454 counts two or more human
# players who took part (a per-port count at 0x800FD140 of at least 76, kept
# by func_0021A9A4; bots don't count; a3 here). While the option is on, one
# will do.
[[patches.hook]]
func = "func_00426454"
before_vram = 0x004264D0
text = "    if (trw_option(11) && (int32_t)ctx->r7 >= 1) ctx->r7 = 2;"

# Enhancements tab: Demo When Idle. The title screen's update (func_002A1FD0)
# starts the attract demo (func_0042E080) once its idle timer at 0x800CD940
# passes a limit, but only while a1 is 1 (the title screen, or menu 0x18).
# With the option off, a1 is 0 here, so the demo never starts.
[[patches.hook]]
