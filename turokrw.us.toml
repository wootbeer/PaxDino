before_vram = 0x002A205C
text = "    if (!trw_option(15)) ctx->r5 = 0;"

# Graphics tab: Field of View (src/game/extras.cpp). The camera's call to
# guPerspectiveF (0x002B6ECC); a2 is the vertical angle (float). The other
# call, at 0x0023590C, uses a fixed 47.5 degrees: left alone.
[[patches.hook]]
func = "func_00234FCC"
before_vram = 0x0023567C
text = "    ctx->r6 = (gpr)(int32_t)trw_field_of_view(rdram, (uint32_t)ctx->r6);"

# Enhancements tab: Custom Music (src/main/custom_music.cpp). The music
# object (0x80107DE4, s1 here) has loaded the song it was asked for (+0x28)
